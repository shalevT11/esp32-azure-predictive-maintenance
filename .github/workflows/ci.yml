name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  firmware:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide placeholder secrets (real secrets.h is gitignored)
        run: cp firmware/main/secrets.h.example firmware/main/secrets.h
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32
          path: firmware

  backend:
    name: Lint & build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
